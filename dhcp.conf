# Use DHCP instead of the static address in prj.conf:
#   west build -b nucleo_f429zi Mod-Bus -d build -p -- -DEXTRA_CONF_FILE=dhcp.conf
# The leased address is printed on the serial console.
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_MY_IPV4_NETMASK=""
CONFIG_NET_CONFIG_MY_IPV4_GW=""
