# --- Networking (on-board Ethernet, LAN8742 PHY) ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Connections the board closes itself (e.g. malformed frames) sit in
# TIME_WAIT for 1.5 s. The default of 4 slots ran out after three such
# closes in a row and new clients were refused, so leave headroom.
CONFIG_NET_MAX_CONN=12
CONFIG_NET_MAX_CONTEXTS=14

# Static address. Change to match your LAN, or build with
# -DEXTRA_CONF_FILE=dhcp.conf to get an address from your router.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# --- Modbus: server role, fed raw ADUs by our TCP socket loop ---
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1
CONFIG_MODBUS_SERIAL=n

# --- Board I/O ---
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SENSOR=y

# --- Misc ---
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048
